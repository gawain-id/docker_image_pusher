name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  build:
    name: Pull
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 128
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-android: 'true'
          remove-codeql: 'true'
          build-mount-path: '/var/lib/docker/'

      - name: Prune docker & buildx
        run: |
          docker system prune -af --volumes || true
          docker buildx prune -af || true
          df -hT

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image Aliyun
        run: |
          set -e

          if [ ! -f images.txt ]; then
            echo "Error: images.txt not found"
            exit 1
          fi

          docker login -u "$ALIYUN_REGISTRY_USER" -p "$ALIYUN_REGISTRY_PASSWORD" "$ALIYUN_REGISTRY"

          # 去掉行内 --platform 和 --alias 参数，提取干净的镜像地址
          extract_clean_image() {
            local raw_line="$1"
            echo "$raw_line" \
              | sed -E 's/--platform(=|[[:space:]]+)[^[:space:]]+//g' \
              | sed -E 's/--alias(=|[[:space:]]+)[^[:space:]]+//g' \
              | awk '{print $NF}'
          }

          # 第一遍扫描：判断同名但不同命名空间的镜像
          declare -A duplicate_images
          declare -A temp_map

          while IFS= read -r line || [ -n "$line" ]; do
            line="$(echo "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [[ -z "$line" || "$line" == \#* ]] && continue

            image="$(extract_clean_image "$line")"
            image="${image%%@*}"
            [[ -z "$image" ]] && continue

            image_name_tag="$(echo "$image" | awk -F'/' '{print $NF}')"
            name_space="$(echo "$image" | awk -F'/' '{if (NF>=3) print $(NF-1); else if (NF==2) print $1; else print ""}')"
            ns_key="${name_space}_"
            image_name="$(echo "$image_name_tag" | awk -F':' '{print $1}')"

            if [[ -n "${temp_map[$image_name]}" ]]; then
              if [[ "${temp_map[$image_name]}" != "$ns_key" ]]; then
                echo "duplicate image name: $image_name"
                duplicate_images["$image_name"]="true"
              fi
            else
              temp_map["$image_name"]="$ns_key"
            fi
          done < images.txt

          # 第二遍执行：拉取、打标、推送并立即清理本地镜像
          while IFS= read -r line || [ -n "$line" ]; do
            line="$(echo "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [[ -z "$line" || "$line" == \#* ]] && continue

            platform="$(echo "$line" | sed -n 's/.*--platform[=[:space:]]\+\([^[:space:]]\+\).*/\1/p')"
            alias_name="$(echo "$line" | sed -n 's/.*--alias[=[:space:]]\+\([^[:space:]]\+\).*/\1/p')"
            image="$(extract_clean_image "$line")"

            if [ -z "$image" ]; then
              echo "Skip invalid line: $line"
              continue
            fi

            echo "------------------------------------------------------------------------------"
            echo "Before pull: $(df -h / | awk 'NR==2 {print $4 " available (" $5 " used)"}')"
            echo "Target image: $image | platform: ${platform:-default} | alias: ${alias_name:-none}"

            if [ -n "$platform" ]; then
              docker pull --platform "$platform" "$image"
            else
              docker pull "$image"
            fi

            if [ -n "$platform" ]; then
              platform_prefix="${platform//\//_}_"
            else
              platform_prefix=""
            fi

            image_no_digest="${image%%@*}"
            image_name_tag="$(echo "$image_no_digest" | awk -F'/' '{print $NF}')"
            name_space="$(echo "$image_no_digest" | awk -F'/' '{if (NF>=3) print $(NF-1); else if (NF==2) print $1; else print ""}')"
            image_name="$(echo "$image_name_tag" | awk -F':' '{print $1}')"

            if [[ "$image_name_tag" == *:* ]]; then
              image_tag="$(echo "$image_name_tag" | awk -F':' '{print $2}')"
            else
              image_tag="latest"
            fi

            name_space_prefix=""
            if [[ -n "${duplicate_images[$image_name]}" && -n "$name_space" ]]; then
              name_space_prefix="${name_space}_"
            fi

            if [ -n "$alias_name" ]; then
              target_name_tag="${alias_name}:${image_tag}"
            else
              target_name_tag="${image_name_tag}"
            fi

            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/${platform_prefix}${name_space_prefix}${target_name_tag}"

            echo "docker tag \"$image\" \"$new_image\""
            docker tag "$image" "$new_image"

            echo "docker push \"$new_image\""
            docker push "$new_image"

            echo "Cleaning up local images..."
            docker rmi "$image" "$new_image" 2>/dev/null || true
            docker image prune -f >/dev/null 2>&1 || true
            echo "After cleanup: $(df -h / | awk 'NR==2 {print $4 " available (" $5 " used)"}')"
          done < images.txt
